<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reports</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a12;
    --surface: #1a1a2e;
    --card: #201f36;
    --border: #33325a;
    --text: #ffffff;
    --muted: #a0a0c8;
    --accent: #6d8bff;

    --gaming: #a78bfa;
    --gaming-bg: linear-gradient(135deg, #3a2a63, #2a1f52);
    --slime: #2ee6b8;
    --slime-bg: linear-gradient(135deg, #0f4a3e, #0a3530);
    --cartoon: #ff9142;
    --cartoon-bg: linear-gradient(135deg, #4a2a12, #3a1f14);

    --phone-w: 440px;
    --phone-h: 760px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #000000;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 32px 20px;
  }

  .icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .phone {
    width: var(--phone-w);
    height: var(--phone-h);
    background: #14141f;
    border-radius: 46px;
    border: 3px solid var(--accent);
    box-shadow: 0 0 0 1px var(--accent)33, 0 30px 80px #00000090, 0 0 60px -20px var(--accent)55;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .notch {
    width: 140px;
    height: 26px;
    background: #05050a;
    border-radius: 0 0 18px 18px;
    margin: 0 auto;
    flex-shrink: 0;
  }

  .screen {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 28px;
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    flex-shrink: 0;
  }

  .app-header {
    background: linear-gradient(135deg, #262650, #1a1a35);
    padding: 12px 26px 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .app-header .icon { width: 24px; height: 24px; color: var(--accent); }
  .app-date {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
    font-family: 'DM Mono', monospace;
  }

  .scroll-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 26px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: none;
  }
  .scroll-content::-webkit-scrollbar { display: none; }

  /* Screen time hero */
  .hero {
    background: linear-gradient(135deg, #7c5cff, #4d7bff 55%, #2ee6b8);
    border-radius: 24px;
    padding: 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 12px 34px -10px #7c5cffaa;
  }
  .hero-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #dce4ff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hero-label .icon { width: 18px; height: 18px; }
  .hero-time {
    font-size: 58px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .hero-time span { font-size: 22px; font-weight: 500; color: #dce4ff; }

  /* Summary card */
  .card {
    border-radius: 22px;
    padding: 16px 22px;
  }
  .card.summary-card {
    background: var(--card);
    border: 2px solid var(--border);
  }
  .card-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-label .icon { width: 18px; height: 18px; }
  .card-text {
    font-size: 18px;
    line-height: 1.6;
    color: #dcdcf5;
  }

  /* Video group cards, colored per topic */
  .video-group {
    border-radius: 22px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    border: 2px solid transparent;
  }
  .video-group.gaming { background: var(--gaming-bg); border-color: var(--gaming)70; box-shadow: 0 8px 24px -12px var(--gaming)99; }
  .video-group.slime { background: var(--slime-bg); border-color: var(--slime)70; box-shadow: 0 8px 24px -12px var(--slime)99; }
  .video-group.cartoon { background: var(--cartoon-bg); border-color: var(--cartoon)70; box-shadow: 0 8px 24px -12px var(--cartoon)99; }

  .video-icon {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .video-icon .icon { width: 32px; height: 32px; stroke: #fff; }
  .video-group.gaming .video-icon { background: linear-gradient(135deg, var(--gaming), #7c5cff); }
  .video-group.slime .video-icon { background: linear-gradient(135deg, var(--slime), #12b88a); }
  .video-group.cartoon .video-icon { background: linear-gradient(135deg, var(--cartoon), #ff5c5c); }

  .video-info { flex: 1; min-width: 0; }
  .video-topic {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 3px;
  }
  .video-group.gaming .video-topic { color: var(--gaming); }
  .video-group.slime .video-topic { color: var(--slime); }
  .video-group.cartoon .video-topic { color: var(--cartoon); }
  .video-creator {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .video-group.gaming .video-creator { color: var(--gaming); }
  .video-group.slime .video-creator { color: var(--slime); }
  .video-group.cartoon .video-creator { color: var(--cartoon); }

  .video-meta {
    font-size: 14px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="status-bar"><span>9:41</span><span>▊▊▊▊</span></div>
    <div class="app-header">
      <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><circle cx="9" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.2" fill="currentColor" stroke="none"/><path d="M9 17.5h6"/></svg>
      <div class="app-date">Tue, Feb 18</div>
    </div>
    <div class="scroll-content">

      <div class="hero">
        <div class="hero-label">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          Screen Time Today
        </div>
        <div class="hero-time">1h 34<span>m</span></div>
      </div>

      <div class="card summary-card">
        <div class="card-label">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 1-3.5-6.6"/><path d="M21 4v5h-5"/></svg>
          What Happened Today
        </div>
        <div class="card-text">You watched games, slime videos, and cartoons today. Nice mix!</div>
      </div>

      <div class="video-group gaming">
        <div class="video-icon">
          <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="18.5" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="video-info">
          <div class="video-topic">Gaming</div>
          <div class="video-creator">Cubequill</div>
          <div class="video-meta">3 videos · 42 min</div>
        </div>
      </div>

      <div class="video-group slime">
        <div class="video-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
        </div>
        <div class="video-info">
          <div class="video-topic">Slime-Making</div>
          <div class="video-creator">Goozzle Pop</div>
          <div class="video-meta">2 videos · 28 min</div>
        </div>
      </div>

      <div class="video-group cartoon">
        <div class="video-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 8.5 20 5l1 3.5L4 12z"/><rect x="3" y="8.5" width="18" height="11" rx="2"/><path d="M7.5 8 10 4.5M13 7l2-3.2"/></svg>
        </div>
        <div class="video-info">
          <div class="video-topic">Cartoons</div>
          <div class="video-creator">Toonaroo</div>
          <div class="video-meta">2 videos · 24 min</div>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
