<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Moderation</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000; --card: #1a1a26; --border: #2e2e3e; --text: #e2e2f2;
    --muted: #a5a5cf; --accent: #7c93ff; --red: #ff4d6d; --red-soft: #ff4d6d22;
    --green: #34d399; --pr: 2.1666;
  }
  html, body { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: #000; color: var(--text); height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; gap: 2.2vh; }
  .bloom{width:1em;height:1em;display:inline-block;vertical-align:middle;flex-shrink:0}
  .bloom path{fill:none;stroke:url(#bloomGrad);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .bloom.spin path{animation:bloomspin 4.5s linear infinite}
  @keyframes bloomspin{to{filter:hue-rotate(360deg)}}
  .icon { width: 1em; height: 1em; flex-shrink: 0; }

  /* ===== External option controls — NOT part of the simulated phone ===== */
  .tabbar-external { display: flex; gap: 1.2vh; z-index: 5; }
  .tabbtn { padding: 1.4vh 2.6vh; border-radius: 14px; font-size: 2.1vh; font-weight: 700; color: var(--muted); background: #16161f; border: 2px solid var(--border); cursor: pointer; transition: all 0.25s; }
  .tabbtn.on { color: #fff; }
  .tabbtn[data-tab="none"].on { background: linear-gradient(135deg,#1b3a2c,#123023); border-color: var(--green); color: var(--green); }
  .tabbtn[data-tab="full"].on { background: linear-gradient(135deg,#3a1b22,#2a1017); border-color: var(--red); color: var(--red); }
  .tabbtn[data-tab="gran"].on { background: linear-gradient(135deg,#1c2440,#131a30); border-color: var(--accent); color: var(--accent); }

  /* ===== Phone, held horizontally ===== */
  .phone { position: relative; width: min(90vw, 82vh * var(--pr)); height: min(82vh, 90vw / var(--pr)); background: #0c0c12; border-radius: 4.4vh; border: 3px solid #2a2a3a; box-shadow: 0 0 0 1px #ffffff0d inset, 0 26px 70px #00000099; overflow: hidden; display: flex; flex-direction: column; }
  .cam-dot { position: absolute; top: 50%; right: 1.4vh; transform: translateY(-50%); width: 1.3vh; height: 1.3vh; border-radius: 50%; background: #060608; border: 1px solid #333; z-index: 6; }

  .stagewrap { flex: 1; position: relative; min-height: 0; background: #000; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .sbg { position: absolute; inset: 0; background: linear-gradient(120deg,#8f6fd6,#4f9fd8 33%,#3fc79e 66%,#e88f4a); }
  .sbg::before { content:''; position:absolute; width:22%; height:40%; background:radial-gradient(circle,#ffffff33 0%,transparent 70%); top:-6%; right:-4%; animation:bgp 3s ease-in-out infinite; animation-play-state: paused; }
  .scene.playing .sbg::before { animation-play-state: running; }
  @keyframes bgp { 0%,100%{transform:scale(1);opacity:.5} 50%{transform:scale(1.3);opacity:1} }
  .cast { position:absolute; inset:0; }
  .person { position:absolute; bottom:8%; left:50%; transform:translateX(-50%); }
  .person.a { left:38%; }
  .person.b { left:62%; }
  .pbody { width:13vh; height:22vh; background:linear-gradient(180deg,#2d6a9f 0%,#1a3a5c 100%); border-radius:1.8vh 1.8vh 0 0; position:relative; animation:bob 1.2s ease-in-out infinite; animation-play-state: paused; box-shadow: 0 1vh 2vh -0.6vh #00000066; }
  .person.b .pbody { background:linear-gradient(180deg,#e07a3a 0%,#a5501c 100%); animation-delay: 0.15s; }
  .scene.playing .pbody { animation-play-state: running; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-0.4vh)} }
  .phead { width:9.8vh; height:9.8vh; background:#e8c99a; border-radius:50%; position:absolute; top:-9.4vh; left:50%; transform:translateX(-50%); animation:hbob 1.2s ease-in-out infinite; animation-play-state: paused; }
  .person.b .phead { background:#e0b184; animation-delay: 0.15s; }
  .scene.playing .phead { animation-play-state: running; }
  @keyframes hbob { 0%,100%{transform:translateX(-50%) rotate(-2deg)} 50%{transform:translateX(-50%) rotate(2deg)} }
  .eyes { position:absolute; top:36%; left:50%; transform:translateX(-50%); display:flex; gap:1.5vh; }
  .eye { width:1.3vh; height:1.3vh; background:#2a2a2a; border-radius:50%; display:block; }
  .brow { position:absolute; top:24%; width:2vh; height:0.6vh; background:#6b4a30; border-radius:1px; transition: transform 0.2s ease; }
  .brow.left { left:22%; transform:rotate(6deg); }
  .brow.right { right:22%; transform:rotate(-6deg); }
  .mouth { position:absolute; bottom:20%; left:50%; transform:translateX(-50%); width:2.6vh; height:1.1vh; background:#8a4a3a; border-radius:3px; transition: all 0.2s ease; }

  @keyframes yellFlap { 0%,100%{transform:translateX(-50%) scaleY(1)} 50%{transform:translateX(-50%) scaleY(0.4)} }
  .person.yelling .brow.left { transform:rotate(-16deg) translateY(-1px); }
  .person.yelling .brow.right { transform:rotate(16deg) translateY(-1px); }
  .person.yelling .mouth { width:4.6vh; height:4.2vh; border-radius:50% 50% 60% 60%; background:#5c1616; transform-origin:center; animation: yellFlap 0.24s ease-in-out infinite; }

  @keyframes lunge { 0%,100%{transform:translateX(-50%) translateX(0)} 40%{transform:translateX(-50%) translateX(4.6vh)} }
  .person.b.pushing .pbody, .person.b.pushing .phead { animation: lunge 0.45s ease-out 1; }

  @keyframes knockback { 0%{transform:translateX(-50%) translateX(0) rotate(0deg)} 30%{transform:translateX(-50%) translateX(-5vh) rotate(-6deg)} 60%{transform:translateX(-50%) translateX(-7.2vh) rotate(-3deg)} 100%{transform:translateX(-50%) translateX(-6vh) rotate(-2deg)} }
  .person.a.pushed { animation: knockback 0.55s ease-out 0.15s 1 forwards; }

  /* fixed, non-moving speech bubbles pinned above each character */
  .talk-bubble { position:absolute; top:17%; background:rgba(18,42,68,.94); border:1px solid rgba(120,170,230,.65); border-radius:1.4vh; padding:1.2vh 2vh; font-size:2.6vh; font-weight:700; color:#cfe3ff; opacity:0; transform:translateY(-4px); transition:opacity .25s, transform .25s; pointer-events:none; max-width:34%; line-height:1.35; text-align:center; z-index:12; }
  .talk-bubble.a { left:38%; transform:translateX(-50%) translateY(-4px); }
  .talk-bubble.a.show { transform:translateX(-50%) translateY(0); }
  .talk-bubble.b { left:62%; background:rgba(102,50,20,.94); border-color:rgba(230,150,100,.65); color:#ffd9b8; transform:translateX(-50%) translateY(-4px); }
  .talk-bubble.b.show { transform:translateX(-50%) translateY(0); }
  .talk-bubble.show { opacity:1; }

  .mutebadge { position:absolute; top:3%; left:2.4%; background:rgba(16,16,22,.94); border:1.5px solid var(--accent); border-radius:1.2vh; padding:1.2vh 2.2vh; font-size:2.15vh; color:var(--accent); font-weight:700; opacity:0; transition:opacity .3s; z-index:15; }
  .mutebadge.on { opacity:1; }

  .hidden-overlay { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6vh; opacity:0; transition:opacity .3s; z-index:18; }
  .hidden-overlay.on { opacity:1; }
  .hidden-overlay .icon { width:5.4vh; height:5.4vh; color:var(--muted); }
  .hidden-overlay .lbl { font-size:2.6vh; font-weight:700; color:var(--text); letter-spacing:0.02em; }

  .blockscreen { position:absolute; inset:0; background:rgba(6,6,9,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.8vh; opacity:0; transition:opacity .35s; z-index:30; padding:3% 9%; }
  .blockscreen.on { opacity:1; }
  .bsico { width:6.4vh; height:6.4vh; color:var(--red); }
  .bstitle { font-size:3.6vh; font-weight:700; color:#fff; text-align:center; }
  .bsbadge { background:var(--red-soft); border:1px solid var(--red)55; border-radius:1vh; padding:0.9vh 2.2vh; font-size:2.1vh; color:var(--red); font-weight:600; }

  .ai-explain { background:rgba(109,139,255,.12); border:1.5px solid rgba(124,147,255,.5); border-radius:1.6vh; padding:2vh 2.8vh; font-size:2.5vh; color:var(--text); line-height:1.55; text-align:left; width:100%; max-width:660px; opacity:0; transform:translateY(6px); transition:opacity 0.5s,transform 0.5s; display:flex; align-items:center; gap:2vh; }
  .ai-explain.on { opacity:1; transform:translateY(0); }
  .ai-explain .bloom { width:9vh; height:9vh; flex-shrink:0; }

  .chat-prompt { display:flex; align-items:center; gap:9px; background:rgba(109,139,255,.14); border:1px solid var(--accent)55; border-radius:22px; padding:1.2vh 2.6vh; font-size:2.1vh; color:var(--accent); font-weight:600; opacity:0; transform:translateY(4px); transition:opacity 0.5s 0.2s,transform 0.5s 0.2s; cursor:pointer; }
  .chat-prompt.on { opacity:1; transform:translateY(0); }
  .chat-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  .thumb { position:absolute; inset:0; background:linear-gradient(160deg,#0d1b2a 0%,#1b2838 60%,#0a1628 100%); display:flex; align-items:center; justify-content:center; z-index:25; transition:opacity .3s; }
  .thumb.gone { opacity:0; pointer-events:none; }
  .playbtn { width:9vh; height:9vh; background:rgba(0,0,0,.78); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:4vh; color:#fff; }

  .ytctrl { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.93)); padding:1.4% 2% 1%; z-index:20; }
  .ptrack { width:100%; height:0.8vh; background:rgba(255,255,255,.25); border-radius:2px; position:relative; margin-bottom:1%; overflow:hidden; }
  .pfill { height:100%; background:#ff0000; border-radius:2px; width:0%; position:relative; }
  .crow { display:flex; align-items:center; justify-content:space-between; }
  .cleft { display:flex; align-items:center; gap:1.6vh; }
  .cbtn { font-size:2.3vh; color:#fff; }
  .tdisp { font-size:1.9vh; color:rgba(255,255,255,.82); font-family:'DM Mono',monospace; }

  .aitag { position:absolute; top:3%; right:2.4%; background:rgba(16,16,22,.92); border:1.5px solid var(--accent); border-radius:1.2vh; padding:1.1vh 2vh; font-size:2.05vh; color:var(--accent); font-weight:700; opacity:0; transition:opacity .3s; z-index:21; display:flex; align-items:center; gap:1vh; }
  .aitag.on { opacity:1; }
  .aitag .bloom { width:3.2vh; height:3.2vh; }

  .rbtn { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 22px; padding: 1.4vh 2.6vh; font-size: 2vh; font-weight: 600; cursor: pointer; transition: all .2s; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 6px; }
  .rbtn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="bloomGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff4d6d"/><stop offset="20%" stop-color="#fb923c"/><stop offset="40%" stop-color="#fbbf24"/><stop offset="60%" stop-color="#34d399"/><stop offset="80%" stop-color="#5b8dee"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs></svg>

<div class="tabbar-external">
  <div class="tabbtn" data-tab="none" onclick="selectTab('none')">No Restriction</div>
  <div class="tabbtn" data-tab="full" onclick="selectTab('full')">Full Restriction</div>
  <div class="tabbtn" data-tab="gran" onclick="selectTab('gran')">Granular Moderation</div>
</div>

<div class="phone">
  <div class="cam-dot"></div>
  <div class="stagewrap">
    <div class="scene" id="scene">
      <div class="sbg"></div>
      <div class="cast" id="cast">
        <div class="person a"><div class="pbody"><div class="phead"><div class="eyes"><span class="eye"></span><span class="eye"></span></div><div class="brow left"></div><div class="brow right"></div><div class="mouth"></div></div></div></div>
        <div class="person b"><div class="pbody"><div class="phead"><div class="eyes"><span class="eye"></span><span class="eye"></span></div><div class="brow left"></div><div class="brow right"></div><div class="mouth"></div></div></div></div>
      </div>
      <div class="talk-bubble a" id="bubA">Ugh, you're the worst!</div>
      <div class="talk-bubble b" id="bubB">GET OUT!!! NOW!!</div>
    </div>
    <div class="mutebadge" id="mutebadge">🔇 Audio Muted </div>
    <div class="aitag" id="aitag"></div>
    <div class="thumb" id="thumb"><div class="playbtn">▶</div></div>

    <div class="hidden-overlay" id="hiddenOverlay">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6 0 9.5 5 10.5 7-0.4.8-1.3 2.2-2.7 3.6M6.7 6.7C4.5 8.1 3 10.3 1.5 12c1 2 4.5 7 10.5 7 1.3 0 2.5-.2 3.6-.6"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/></svg>
      <div class="lbl">Video Content Hidden</div>
    </div>

    <div class="blockscreen" id="blockscreen">
      <svg class="bsico icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <div class="bstitle" id="bstitle">Video Restricted</div>
      <div class="bsbadge">⚠ Restricted</div>
      <div class="ai-explain on" id="ai-explain"><svg class="bloom" viewBox="0 0 100 100"><path d="M50 18 C56 30 70 30 74 20 C68 32 76 44 90 42 C76 46 76 60 86 68 C72 60 62 68 64 82 C58 70 44 70 40 82 C46 68 34 60 20 62 C34 56 32 42 20 34 C34 40 42 30 36 18 C44 28 50 28 50 18 Z"/></svg><span id="explain-text"></span></div>
      <div class="chat-prompt on"><div class="chat-dot"></div>Have questions? Tap to chat</div>
    </div>

    <div class="ytctrl">
      <div class="ptrack"><div class="pfill" id="pfill"></div></div>
      <div class="crow"><div class="cleft"><span class="cbtn" id="playpause">⏸</span><span class="cbtn" id="volicon">🔊</span><span class="tdisp" id="tdisp">0:00 / 4:12</span></div><span class="cbtn">⛶</span></div>
    </div>
  </div>
</div>

<div class="rbtn" onclick="replayCurrent()">↺ Replay</div>

<script>
let ctx=null;
function ac(){
  if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state === 'suspended') ctx.resume();
  return ctx;
}
// Some browsers only unlock audio on a real user gesture — make sure the very
// first tap/click anywhere always tries to wake the context back up.
['pointerdown','click','touchstart'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ if(ctx && ctx.state==='suspended') ctx.resume(); }, { passive:true });
});

// ---- gibberish "muffled adult mumble" voices, distinct per character ----
let masterGain=null;
function ensureGain(){ const a=ac(); if(!masterGain){ masterGain=a.createGain(); masterGain.gain.setValueAtTime(0.3,a.currentTime); masterGain.connect(a.destination);} return masterGain; }
function muteGain(){ if(masterGain) masterGain.gain.linearRampToValueAtTime(0, ac().currentTime+0.12); }
function unmuteGain(){ if(masterGain) masterGain.gain.linearRampToValueAtTime(0.3, ac().currentTime+0.12); }

let liveNodes = { a: null, b: null };
function startTalk(id){
  stopTalk(id);
  const a = ac(); ensureGain();
  const cfg = id==='a'
    ? { carrierFreq:105, carrierType:'sawtooth', lfoRate:2.6, lfoDepth:340, filterBase:420, filterQ:3.5, envRate:5.2, drive:false }
    : { carrierFreq:150, carrierType:'square',   lfoRate:6.2, lfoDepth:600, filterBase:600, filterQ:6.5, envRate:9.5, drive:true  };

  const carrier = a.createOscillator(); carrier.type = cfg.carrierType; carrier.frequency.value = cfg.carrierFreq;
  const filter = a.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = cfg.filterBase; filter.Q.value = cfg.filterQ;
  const lfo = a.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = cfg.lfoRate;
  const lfoGain = a.createGain(); lfoGain.gain.value = cfg.lfoDepth;
  lfo.connect(lfoGain); lfoGain.connect(filter.frequency);

  const envOsc = a.createOscillator(); envOsc.type = 'square'; envOsc.frequency.value = cfg.envRate;
  const envDepth = a.createGain(); envDepth.gain.value = 0.42;
  const voiceGain = a.createGain(); voiceGain.gain.value = 0.42;
  envOsc.connect(envDepth); envDepth.connect(voiceGain.gain);

  let chain = filter;
  let shaper = null;
  if (cfg.drive) {
    shaper = a.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = (i/255)*2-1; curve[i] = Math.tanh(x*3); }
    shaper.curve = curve; shaper.oversample = '2x';
    filter.connect(shaper); chain = shaper;
  }

  carrier.connect(filter);
  chain.connect(voiceGain);
  voiceGain.connect(masterGain);

  carrier.start(); lfo.start(); envOsc.start();
  liveNodes[id] = { carrier, lfo, envOsc, filter, lfoGain, envDepth, voiceGain, shaper };
}
function stopTalk(id){
  const n = liveNodes[id];
  if (!n) return;
  const a = ac();
  try {
    n.voiceGain.gain.linearRampToValueAtTime(0, a.currentTime+0.06);
    n.carrier.stop(a.currentTime+0.08); n.lfo.stop(a.currentTime+0.08); n.envOsc.stop(a.currentTime+0.08);
  } catch(e){}
  liveNodes[id] = null;
}
function stopAllTalk(){ stopTalk('a'); stopTalk('b'); }

// ---- a small looping background tune, routed through the same master gain as the
// voices, so it keeps running the whole time but audibly cuts to silence at exactly
// the moments the feature mutes something ----
let bgTimer = null, bgActive = false;
function startBgMusic(){
  stopBgMusic();
  const a = ac(); ensureGain();
  bgActive = true;
  const notes = [130.81, 164.81, 196.00, 164.81, 130.81, 196.00, 220.00, 164.81]; // simple looping bounce
  let i = 0;
  function step(){
    if(!bgActive) return;
    const f = notes[i % notes.length]; i++;
    const o = a.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = f/2;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.linearRampToValueAtTime(0.55, a.currentTime+0.05);
    g.gain.linearRampToValueAtTime(0.0001, a.currentTime+0.44);
    o.connect(g); o2.connect(g); g.connect(masterGain);
    o.start(); o2.start(); o.stop(a.currentTime+0.46); o2.stop(a.currentTime+0.46);
    bgTimer = setTimeout(step, 460);
  }
  step();
}
function stopBgMusic(){ bgActive = false; if(bgTimer){ clearTimeout(bgTimer); bgTimer = null; } }

const EXPLAIN_TEXT = "This video is restricted because it shows people getting hurt or fighting. It can be upsetting for your age.";
const GRAN_MUTE_MSG = "🔇 Audio Muted — Language";

const TOTAL=15000, AS=0.30, AE=0.50, BS=0.58, BE=0.80, PUSH_AT=0.63;
function fmt(frac){const s=Math.floor(frac*252);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} / 4:12`;}

let curTab='none';
let runToken=0;
let timers = [];
function tm(fn, d){ timers.push(setTimeout(fn, d)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function gel(id){return document.getElementById(id);}

function resetVisual(){
  clearTimers();
  gel('pfill').style.transition = 'none';
  gel('pfill').style.width='0%';
  gel('tdisp').textContent='0:00 / 4:12';
  gel('bubA').classList.remove('show'); gel('bubB').classList.remove('show');
  gel('scene').classList.remove('playing');
  gel('mutebadge').classList.remove('on'); gel('aitag').classList.remove('on'); gel('aitag').innerHTML='';
  gel('blockscreen').classList.remove('on');
  gel('hiddenOverlay').classList.remove('on');
  gel('volicon').textContent='🔊';
  const cast=gel('cast');
  cast.querySelector('.person.a').classList.remove('yelling','pushed');
  cast.querySelector('.person.b').classList.remove('yelling','pushing');
  gel('bstitle').textContent = 'Video Restricted';
  stopAllTalk();
  stopBgMusic();
}

function selectTab(tab){
  curTab = tab;
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  runToken++;
  const myToken = runToken;
  resetVisual();
  gel('thumb').classList.remove('gone');
  tm(()=>{ if(myToken===runToken) runTab(tab, myToken); }, 250);
}
function replayCurrent(){ selectTab(curTab); }

function runTab(tab, token){
  if(tab==='full'){ runFullBlock(token); return; }

  const scene=gel('scene'), cast=gel('cast'), pA=cast.querySelector('.person.a'), pB=cast.querySelector('.person.b');
  scene.classList.add('playing');
  gel('thumb').classList.add('gone');
  startBgMusic();

  // progress bar + time readout driven purely by CSS transition + a lightweight display ticker
  requestAnimationFrame(()=>{
    gel('pfill').style.transition = `width ${TOTAL/1000}s linear`;
    gel('pfill').style.width = '100%';
  });
  let elapsed = 0;
  const dispIv = setInterval(()=>{
    if(token!==runToken){ clearInterval(dispIv); return; }
    elapsed += 200;
    gel('tdisp').textContent = fmt(Math.min(elapsed/TOTAL,1));
    if(elapsed>=TOTAL) clearInterval(dispIv);
  }, 200);

  function at(frac, fn){ tm(()=>{ if(token===runToken) fn(); }, frac*TOTAL); }

  // Person A's "bad word" moment — always visible in this file; muted in granular mode
  at(AS, ()=>{
    pA.classList.add('yelling'); gel('bubA').classList.add('show'); startTalk('a');
    if(tab==='gran'){
      muteGain();
      gel('mutebadge').innerHTML = GRAN_MUTE_MSG; gel('mutebadge').classList.add('on'); gel('volicon').textContent='🔇';
      gel('aitag').innerHTML = `<svg class="bloom" viewBox="0 0 100 100"><path d="M50 18 C56 30 70 30 74 20 C68 32 76 44 90 42 C76 46 76 60 86 68 C72 60 62 68 64 82 C58 70 44 70 40 82 C46 68 34 60 20 62 C34 56 32 42 20 34 C34 40 42 30 36 18 C44 28 50 28 50 18 Z"/></svg> Muted for language`;
      gel('aitag').classList.add('on');
    }
  });
  at(AE, ()=>{
    pA.classList.remove('yelling'); gel('bubA').classList.remove('show'); stopTalk('a');
    if(tab==='gran'){ unmuteGain(); gel('mutebadge').classList.remove('on'); gel('aitag').classList.remove('on'); gel('volicon').textContent='🔊'; }
  });

  if(tab==='none'){
    at(BS, ()=>{ pB.classList.add('yelling'); gel('bubB').classList.add('show'); startTalk('b'); });
    at(PUSH_AT, ()=>{
      pB.classList.remove('yelling'); gel('bubB').classList.remove('show'); stopTalk('b');
      pB.classList.add('pushing'); pA.classList.add('pushed');
      tm(()=>{ if(token===runToken) pB.classList.remove('pushing'); }, 700);
    });
  } else if(tab==='gran'){
    // The shove + "GET OUT NOW" is rude and violent — hide it completely, audio and video both, no explanation needed
    at(BS, ()=>{
      muteGain(); gel('volicon').textContent='🔇';
      gel('hiddenOverlay').classList.add('on');
      gel('aitag').innerHTML = `<svg class="bloom" viewBox="0 0 100 100"><path d="M50 18 C56 30 70 30 74 20 C68 32 76 44 90 42 C76 46 76 60 86 68 C72 60 62 68 64 82 C58 70 44 70 40 82 C46 68 34 60 20 62 C34 56 32 42 20 34 C34 40 42 30 36 18 C44 28 50 28 50 18 Z"/></svg> Hidden for fighting`;
      gel('aitag').classList.add('on');
    });
    at(BE, ()=>{
      gel('hiddenOverlay').classList.remove('on'); unmuteGain(); gel('volicon').textContent='🔊';
      gel('aitag').classList.remove('on');
    });
  }

  tm(()=>{ if(token===runToken){ scene.classList.remove('playing'); stopAllTalk(); stopBgMusic(); } }, TOTAL+80);
}

function runFullBlock(token){
  const scene=gel('scene');
  scene.classList.add('playing');
  gel('bstitle').textContent='Video Restricted';
  gel('explain-text').textContent = EXPLAIN_TEXT;
  const logo = document.querySelector('#ai-explain .bloom');
  tm(()=>{ if(token!==runToken) return; logo.classList.add('spin');
    tm(()=>{ if(token!==runToken) return; logo.classList.remove('spin'); }, 2600);
  }, 900);
  tm(()=>{ if(token!==runToken) return; gel('thumb').classList.add('gone'); }, 1000);
  tm(()=>{ if(token!==runToken) return; gel('blockscreen').classList.add('on'); scene.classList.remove('playing'); }, 1350);
}

window.addEventListener('load', ()=>{
  
});
