<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mediator - AI Child Conversations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #06060f; --card: #12121e; --card2: #1a1a2a; --border: #252538;
  --text: #eeeef5; --muted: #7070a0; --accent: #5b8dee;
  --green: #34d399; --red: #ff4d6d; --teal: #2dd4bf;
  --child: #c084fc; --ai-col: #60a5fa;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 52px; }
h1.title { font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; text-align: center; }
h2.subtitle { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 5px; text-align: center; letter-spacing: -0.5px; }
h2.subtitle span { color: var(--accent); }
.intro { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 20px; line-height: 1.6; max-width: 820px; }
.stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 1100px; }
.slide-meta { display: flex; align-items: center; gap: 14px; }
.slide-counter { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); }
.dots { display: flex; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.4s; cursor: pointer; }
.dot.on { background: var(--accent); }
.dot.done { background: var(--green)88; }
.slide-card { width: 100%; display: none; flex-direction: column; cursor: pointer; user-select: none; }
.slide-card.active { display: flex; }
.slide-hdr { background: var(--card2); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 12px 20px; }
.slide-num { font-size: 9.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.13em; }
.slide-name { font-size: 15px; font-weight: 700; color: var(--text); }

.click-hint { font-size: 10px; color: var(--muted); text-align: center; padding: 6px 0 0; opacity: 0; transition: opacity 0.5s; }
.click-hint.show { opacity: 1; }

.tablet-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 0 0 16px 16px; padding: 16px; }
.tablet { width: 100%; max-width: 680px; margin: 0 auto; height: 480px; background: #0a0a14; border-radius: 22px; border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--accent)33,0 20px 60px #00000099; overflow: hidden; display: flex; flex-direction: column; }
.tab-topbar { display: flex; align-items: center; justify-content: space-between; padding: 7px 18px; background: #060610; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab-appname { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.14em; }
.tab-pagetitle { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
.tab-time { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
.tab-body { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.tab-body::-webkit-scrollbar { display: none; }
.settings-title { font-size: 15px; font-weight: 700; color: var(--text); }
.settings-sub { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.master-row { display: flex; align-items: center; gap: 12px; background: var(--card2); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; opacity: 0; transform: translateY(8px); transition: opacity 0.5s,transform 0.5s,border-color 0.4s,background 0.4s; }
.master-row.show { opacity: 1; transform: translateY(0); }
.master-row.on { border-color: var(--green)55; background: #0d1912; }
.mr-icon { font-size: 20px; flex-shrink: 0; }
.mr-info { flex: 1; }
.mr-name { font-size: 13px; font-weight: 700; color: var(--text); }
.mr-desc { font-size: 10px; color: var(--muted); margin-top: 2px; }
.btog { width: 44px; height: 25px; border-radius: 13px; background: var(--border); position: relative; flex-shrink: 0; transition: background 0.35s; }
.btog.on { background: var(--green); }
.btog::after { content: ''; position: absolute; width: 19px; height: 19px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.35s; box-shadow: 0 1px 4px #00000050; }
.btog.on::after { transform: translateX(19px); }
.sog-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.sog { background: var(--card2); border: 1px solid var(--border); border-radius: 11px; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; opacity: 0; transform: translateY(5px); transition: opacity 0.45s,transform 0.45s,border-color 0.4s,background 0.4s; }
.sog.show { opacity: 1; transform: translateY(0); }
.sog.on { border-color: var(--green)44; background: #0c1810; }
.sog-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.sog-icon { font-size: 15px; flex-shrink: 0; }
.sog-name { font-size: 10.5px; font-weight: 600; color: var(--text); line-height: 1.3; flex: 1; }
.sog-desc { font-size: 9px; color: var(--muted); line-height: 1.4; }
.stog { width: 30px; height: 18px; border-radius: 9px; background: var(--border); position: relative; flex-shrink: 0; transition: background 0.35s; }
.stog.on { background: var(--green); }
.stog::after { content: ''; position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.35s; }
.stog.on::after { transform: translateX(12px); }

.two-panels { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-top: none; border-radius: 0 0 16px 16px; overflow: hidden; background: var(--card); min-height: 520px; position: relative; }
.panel { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); transition: opacity 0.6s; }
.panel:last-child { border-right: none; }
.panel.dimmed { opacity: 0.18; }
.panel-label { padding: 7px 13px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.p-off    .panel-label { color: var(--red);   background: var(--red)08; }
.p-on     .panel-label { color: var(--green);  background: var(--green)08; }
.p-child  .panel-label { color: var(--child);  background: #1b0e2e44; }
.p-parent .panel-label { color: var(--teal);   background: rgba(45,212,191,0.06); }
.label-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.phone-frame { flex: 1; padding: 10px; display: flex; flex-direction: column; }

.phone { flex: 1; background: #0a0a14; border-radius: 14px; border: 1.5px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
.phone-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; background: #06060f; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.phone-bar-name { font-size: 8.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }
.phone-bar-who  { font-size: 8.5px; font-weight: 600; color: var(--muted); }
.phone-bar-time { font-size: 8.5px; color: var(--muted); font-family: 'DM Mono', monospace; }
.phone-body { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.phone-body::-webkit-scrollbar { display: none; }

.brow { display: flex; flex-direction: column; opacity: 0; transform: translateY(5px); transition: opacity 0.4s,transform 0.4s; flex-shrink: 0; }
.brow.show { opacity: 1; transform: translateY(0); }
.brow.ai     { align-items: flex-start; }
.brow.child  { align-items: flex-end; }
.brow.parent { align-items: flex-end; }
.brow.sys    { align-items: center; }
.bsender { font-size: 7px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 2px; padding: 0 3px; }
.brow.ai     .bsender { color: var(--ai-col); }
.brow.child  .bsender { color: var(--child); }
.brow.parent .bsender { color: var(--teal); }
.bubble { border-radius: 12px; padding: 7px 10px; font-size: 10px; line-height: 1.5; max-width: 88%; }
.brow.ai     .bubble { background: #131c32; border: 1px solid var(--ai-col)25; color: var(--text); border-bottom-left-radius: 3px; }
.brow.child  .bubble { background: #1b0e2e; border: 1px solid var(--child)25; color: var(--text); border-bottom-right-radius: 3px; }
.brow.parent .bubble { background: #0a1f1e; border: 1px solid rgba(45,212,191,0.2); color: var(--text); border-bottom-right-radius: 3px; }
.brow.sys    .bubble { background: var(--accent)10; border: 1px solid var(--accent)28; color: var(--accent); font-size: 8.5px; font-weight: 600; border-radius: 6px; text-align: center; max-width: 94%; padding: 4px 9px; }

.typing-row { align-items: flex-start; opacity: 0; transition: opacity 0.3s; flex-shrink: 0; display: flex; flex-direction: column; }
.typing-row.show { opacity: 1; }
.typing-dots { display: flex; align-items: center; gap: 3px; padding: 7px 11px; background: #131c32; border: 1px solid var(--ai-col)25; border-radius: 12px; border-bottom-left-radius: 3px; }
.typing-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--ai-col)80; animation: td 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes td { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-3px)} }

.vc { background: var(--card2); border: 1px solid var(--border); border-radius: 9px; padding: 7px 8px; display: flex; align-items: center; gap: 7px; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.vc.show { opacity: 1; transform: translateY(0); }
.vc-thumb { width: 34px; height: 26px; border-radius: 5px; background: linear-gradient(135deg,#1a1a2e,#252540); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.vc-title { font-size: 9.5px; font-weight: 600; color: var(--text); }
.vc-meta  { font-size: 8px; color: var(--muted); margin-top: 1px; }
.vc-badge { font-size: 7px; font-weight: 700; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; width: fit-content; margin-top: 2px; }
.badge-playing  { background: var(--green)18; color: var(--green); border: 1px solid var(--green)40; }
.badge-blocked  { background: var(--red)18;   color: var(--red);   border: 1px solid var(--red)40; }
.badge-unlocked { background: var(--green)18; color: var(--green); border: 1px solid var(--green)40; }

.blocked-card { background: var(--red)08; border: 1px solid var(--red)33; border-radius: 9px; padding: 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.blocked-card.show { opacity: 1; transform: translateY(0); }
.bc-icon  { font-size: 18px; }
.bc-title { font-size: 10px; font-weight: 700; color: var(--red); }
.bc-sub   { font-size: 8.5px; color: var(--muted); line-height: 1.4; }

.chat-fab-mini { display: flex; align-items: center; gap: 5px; background: var(--accent)18; border: 1px solid var(--accent)55; border-radius: 20px; padding: 4px 10px; font-size: 8.5px; color: var(--accent); font-weight: 600; flex-shrink: 0; opacity: 0; transform: translateY(3px); transition: opacity 0.4s,transform 0.4s; width: fit-content; }
.chat-fab-mini.show { opacity: 1; transform: translateY(0); }
.cfm-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

.notice { background: var(--card2); border: 1px solid var(--border); border-radius: 9px; padding: 7px 9px; font-size: 9.5px; color: var(--muted); line-height: 1.5; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.notice.show { opacity: 1; transform: translateY(0); }
.notice.off { border-color: var(--red)28; background: var(--red)06; }
.notice span { font-weight: 600; color: var(--text); }

.parent-notif { background: #081a18; border: 1px solid rgba(45,212,191,0.25); border-radius: 11px; padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; opacity: 0; transform: translateY(5px); transition: opacity 0.5s,transform 0.5s; }
.parent-notif.show { opacity: 1; transform: translateY(0); }
.pn-header { display: flex; align-items: center; gap: 7px; }
.pn-icon  { font-size: 15px; }
.pn-title { font-size: 9.5px; font-weight: 700; color: var(--teal); }
.pn-app   { font-size: 8px; color: var(--muted); }
.pn-video { font-size: 9px; color: var(--text); line-height: 1.4; }
.pn-video strong { color: rgba(45,212,191,0.85); }

.child-reason { background: var(--child)10; border: 1px solid var(--child)35; border-radius: 8px; padding: 8px 10px; flex-shrink: 0; }
.cr-label { font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--child); margin-bottom: 4px; }
.cr-text  { font-size: 10px; color: var(--text); line-height: 1.55; font-style: italic; }

.pn-chips { display: flex; flex-direction: column; gap: 5px; }
.chip { border-radius: 7px; padding: 6px 9px; font-size: 8.5px; font-weight: 600; border: 1px solid; text-align: left; cursor: pointer; transition: background 0.2s, border-color 0.2s, opacity 0.2s; }
.chip-info { background: var(--accent)10; border-color: var(--accent)40; color: var(--ai-col); }
.chip-yes  { background: var(--green)12;  border-color: var(--green)44;  color: var(--green); }
.chip-no   { background: rgba(45,212,191,0.08); border-color: rgba(45,212,191,0.3); color: var(--teal); }

.vid-summary { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.vid-summary.show { opacity: 1; transform: translateY(0); }
.vs-label { font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 3px; }
.vs-text  { font-size: 9px; color: var(--muted); line-height: 1.5; }

.decision-badge { border-radius: 8px; padding: 7px 10px; font-size: 9px; font-weight: 600; text-align: center; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.4s,transform 0.4s; }
.decision-badge.show { opacity: 1; transform: translateY(0); }
.decision-yes { background: var(--green)12; border: 1px solid var(--green)44; color: var(--green); }
.decision-no  { background: rgba(45,212,191,0.08); border: 1px solid rgba(45,212,191,0.3); color: var(--teal); }

.phone-toast { background: #081a18; border: 1px solid rgba(45,212,191,0.3); border-radius: 9px; padding: 7px 9px; display: flex; align-items: flex-start; gap: 7px; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.phone-toast.show { opacity: 1; transform: translateY(0); }
.pt-icon  { font-size: 12px; flex-shrink: 0; }
.pt-title { font-size: 8px; font-weight: 700; color: var(--teal); }
.pt-body  { font-size: 9px; color: var(--muted); margin-top: 1px; line-height: 1.4; }

.not-yet-overlay { position: absolute; inset: 0; z-index: 10; display: flex; align-items: stretch; opacity: 0; pointer-events: none; transition: opacity 0.8s; }
.not-yet-overlay.show { opacity: 1; pointer-events: auto; }
.nyo-dim { position: absolute; inset: 0; background: rgba(6,6,15,0.82); }
.nyo-panels { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.nyo-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
.nyo-panel:last-child { border-right: none; }
.nyo-label { padding: 7px 13px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.nyo-p .nyo-label { color: var(--teal); background: rgba(45,212,191,0.06); }
.nyo-c .nyo-label { color: var(--child); background: #1b0e2e88; }
.nyo-phone-frame { flex: 1; padding: 10px; display: flex; flex-direction: column; }

.nav-row { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.nav-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 22px; padding: 7px 18px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 5px; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.primary { background: var(--accent)18; border-color: var(--accent)66; color: var(--accent); }
.legend-row { display: flex; gap: 18px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.leg-pip { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<p class="title">AI Mediator</p>
<h2 class="subtitle">AI-Child <span>Conversations</span></h2>
<p class="intro">Click anywhere on a slide to advance. Each panel plays one at a time so you can follow the flow.</p>

<div class="stage-wrap">
  <div class="slide-meta">
    <div class="slide-counter" id="slide-counter">Slide 1 of 4</div>
    <div class="dots" id="dots"></div>
  </div>
  <div id="slides-container" style="width:100%"></div>
  <div class="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="prevSlide()">&#x2190; Prev</button>
    <button class="nav-btn primary" onclick="replaySlide()">&#x21BA; Replay</button>
    <button class="nav-btn" id="btn-next" onclick="nextSlide()">Next &#x2192;</button>
  </div>
  <div class="legend-row">
    <div class="leg"><div class="leg-pip" style="background:var(--ai-col)"></div>AI Mediator</div>
    <div class="leg"><div class="leg-pip" style="background:var(--child)"></div>Child</div>
    <div class="leg"><div class="leg-pip" style="background:var(--teal)"></div>Parent</div>
    <div class="leg"><div class="leg-pip" style="background:var(--accent)"></div>System</div>
  </div>
</div>

<script>
let timers = [];
function tm(fn, d) { timers.push(setTimeout(fn, d)); return d; }
function clrT() { timers.forEach(clearTimeout); timers = []; }
function gel(id) { return document.getElementById(id); }
function show(e) { if (e) e.classList.add('show'); }
function scr(b) { if (b) b.scrollTo({ top: 99999, behavior: 'smooth' }); }

const SLIDES = [
  { title: 'Parent Settings',        num: null },
  { title: 'Chat with AI Mediator',  num: 1    },
  { title: 'Request Access',         num: 2    },
  { title: 'Explain Why Restricted', num: 3    },
];
let cur = 0;

let slidePhase = 0;
let phaseCallbacks = [];

function registerPhases(cbs) {
  phaseCallbacks = cbs;
  slidePhase = 0;
  phaseCallbacks[0]();
}

function advancePhase() {
  slidePhase++;
  if (slidePhase < phaseCallbacks.length) {
    clrT();
    phaseCallbacks[slidePhase]();
  } else {
    nextSlide();
  }
}

function buildSkeleton() {
  const dotsEl = gel('dots'); dotsEl.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div'); d.className = 'dot'; d.id = `dot-${i}`;
    d.onclick = (e) => { e.stopPropagation(); renderSlide(i); };
    dotsEl.appendChild(d);
  });
  const con = gel('slides-container'); con.innerHTML = '';
  SLIDES.forEach((_, i) => { const c = document.createElement('div'); c.className = 'slide-card'; c.id = `sc-${i}`; c.onclick = () => advancePhase(); con.appendChild(c); });
}

function updateMeta(n) {
  gel('slide-counter').textContent = `Slide ${n+1} of ${SLIDES.length}`;
  SLIDES.forEach((_, i) => { const d = gel(`dot-${i}`); d.classList.remove('on','done'); if (i===n) d.classList.add('on'); else if (i<n) d.classList.add('done'); });
  gel('btn-prev').style.opacity = n===0?'0.3':'1'; gel('btn-prev').style.pointerEvents = n===0?'none':'all';
  gel('btn-next').style.opacity = n===SLIDES.length-1?'0.3':'1'; gel('btn-next').style.pointerEvents = n===SLIDES.length-1?'none':'all';
}

function renderSlide(n) {
  clrT(); phaseCallbacks = []; slidePhase = 0;
  SLIDES.forEach((_, i) => { const c = gel(`sc-${i}`); c.classList.remove('active'); c.innerHTML = ''; });
  cur = n; const card = gel(`sc-${n}`); card.classList.add('active'); updateMeta(n);
  const hdr = document.createElement('div'); hdr.className = 'slide-hdr';
  hdr.innerHTML = `<div class="slide-num">${SLIDES[n].num ? `Scenario ${SLIDES[n].num}` : 'Settings'}</div><div class="slide-name">${SLIDES[n].title}</div>`;
  card.appendChild(hdr);
  [buildSettings, buildChat, buildRequest, buildExplain][n](card);
}

function prevSlide() { if (cur > 0) renderSlide(cur - 1); }
function nextSlide() { if (cur < SLIDES.length-1) renderSlide(cur + 1); }
function replaySlide() { renderSlide(cur); }

function mkPhone(who) {
  const p = document.createElement('div'); p.className = 'phone';
  p.innerHTML = `<div class="phone-bar"><div class="phone-bar-name">AI Mediator</div><div class="phone-bar-who">${who}</div><div class="phone-bar-time">9:41</div></div><div class="phone-body"></div>`;
  return p;
}
function pb(ph) { return ph.querySelector('.phone-body'); }

function ap(b, node, d) {
  tm(() => { b.appendChild(node); requestAnimationFrame(() => show(node)); scr(b); }, d);
  return node;
}
function typ(b, d, dur) {
  let r;
  tm(() => { r = document.createElement('div'); r.className = 'typing-row'; r.innerHTML = `<div class="bsender" style="color:var(--ai-col);font-size:7px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px;padding:0 3px;">AI Mediator</div><div class="typing-dots"><span></span><span></span><span></span></div>`; b.appendChild(r); requestAnimationFrame(() => show(r)); scr(b); }, d);
  tm(() => { if (r && r.parentNode) r.remove(); }, d + dur);
}
function bub(role, text) {
  const row = document.createElement('div'); row.className = `brow ${role}`;
  if (role !== 'sys') { const s = document.createElement('div'); s.className = 'bsender'; s.textContent = role === 'ai' ? 'AI Mediator' : role === 'child' ? 'Child' : 'Parent'; row.appendChild(s); }
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text; row.appendChild(b); return row;
}
function vcCard(em, title, meta, bc, bt) {
  const d = document.createElement('div'); d.className = 'vc';
  d.innerHTML = `<div class="vc-thumb">${em}</div><div><div class="vc-title">${title}</div><div class="vc-meta">${meta}</div><div class="vc-badge ${bc}">${bt}</div></div>`; return d;
}
function blkCard(sub) {
  const d = document.createElement('div'); d.className = 'blocked-card';
  d.innerHTML = `<div class="bc-icon">🚫</div><div class="bc-title">Video Restricted</div><div class="bc-sub">${sub}</div>`; return d;
}
function chatFab() {
  const d = document.createElement('div'); d.className = 'chat-fab-mini';
  d.innerHTML = `<div class="cfm-dot"></div>Have questions? Chat with AI Mediator`; return d;
}
function noticeEl(type, html) {
  const d = document.createElement('div'); d.className = `notice ${type}`; d.innerHTML = html; return d;
}
function toastEl(text) {
  const d = document.createElement('div'); d.className = 'phone-toast';
  d.innerHTML = `<div class="pt-icon">🔔</div><div><div class="pt-title">AI Mediator</div><div class="pt-body">${text}</div></div>`; return d;
}
function decBadge(type, text) {
  const d = document.createElement('div'); d.className = `decision-badge decision-${type}`; d.textContent = text; return d;
}

function mk2(card, defs) {
  const grid = document.createElement('div'); grid.className = 'two-panels';
  const phones = defs.map(def => {
    const panel = document.createElement('div'); panel.className = `panel ${def.cls}`; panel.id = def.id || '';
    panel.innerHTML = `<div class="panel-label"><div class="label-dot"></div>${def.label}</div>`;
    const frame = document.createElement('div'); frame.className = 'phone-frame';
    const phone = mkPhone(def.who); frame.appendChild(phone); panel.appendChild(frame); grid.appendChild(panel);
    return phone;
  });
  card.appendChild(grid); return { grid, phones };
}

/* ══════════════════════
   SLIDE 0: SETTINGS
══════════════════════ */
function buildSettings(card) {
  const wrap = document.createElement('div'); wrap.className = 'tablet-wrap';
  const tablet = document.createElement('div'); tablet.className = 'tablet';
  tablet.innerHTML = `<div class="tab-topbar"><div class="tab-appname">AI Mediator</div><div class="tab-pagetitle">AI-Child Conversations</div><div class="tab-time">9:41</div></div>
  <div class="tab-body" id="tb">
    <div><div class="settings-title">AI-Child Conversations</div><div class="settings-sub">Control how the AI interacts with your child during their viewing sessions.</div></div>
    <div class="master-row" id="mr"><div class="mr-icon">🤖</div><div class="mr-info"><div class="mr-name">AI-Child Conversations</div><div class="mr-desc">Allow AI Mediator to have conversations with your child while they watch</div></div><div class="btog" id="btog"></div></div>
    <div class="sog-grid">
      <div class="sog" id="sg0"><div class="sog-top"><div class="sog-icon">💬</div><div class="sog-name">Your child can ask the AI anything while watching</div><div class="stog" id="st0"></div></div><div class="sog-desc">Opens a chat channel throughout their entire session, before, during, or after any video</div></div>
      <div class="sog" id="sg1"><div class="sog-top"><div class="sog-icon">🔑</div><div class="sog-name">Request access on behalf</div><div class="stog" id="st1"></div></div><div class="sog-desc">AI forwards the child's unblock request to the parent with a summary and their reason</div></div>
      <div class="sog" id="sg2"><div class="sog-top"><div class="sog-icon">🚫</div><div class="sog-name">Explain restriction decisions</div><div class="stog" id="st2"></div></div><div class="sog-desc">AI explains in simple terms why a video was blocked and what happens next</div></div>
    </div>
  </div>`;
  wrap.appendChild(tablet); card.appendChild(wrap);

  registerPhases([
    () => {
      const T = 400;
      tm(() => show(gel('mr')), T);
      tm(() => { gel('btog').classList.add('on'); gel('mr').classList.add('on'); }, T+800);
      [0,1,2].forEach(i => {
        tm(() => show(gel(`sg${i}`)), T+1600+i*550);
        tm(() => { gel(`st${i}`).classList.add('on'); gel(`sg${i}`).classList.add('on'); }, T+1600+i*550+440);
      });
    }
  ]);
}

/* ══════════════════════
   SLIDE 1: CHAT
══════════════════════ */
function buildChat(card) {
  const { phones, grid } = mk2(card, [
    { cls: 'p-off', label: 'Feature Off', who: 'Child', id: 'p-off' },
    { cls: 'p-on',  label: 'Feature On',  who: 'Child', id: 'p-on'  },
  ]);
  const off = pb(phones[0]), on = pb(phones[1]);

  registerPhases([
    () => {
      phones[1].closest('.panel').classList.add('dimmed');
      let t = 300;
      ap(off, vcCard('🎬','MrBeast: $1 vs $1,000,000 Hotel Room','MrBeast · 16 min','badge-playing','Playing now'), t);
      ap(off, bub('child', 'Wait, how are they surviving that fall into the pool? That looks insane'), t+1400);
      ap(off, noticeEl('off','<span>Chat is off.</span> The child gets no response.'), t+3200);
    },
    () => {
      phones[1].closest('.panel').classList.remove('dimmed');
      phones[0].closest('.panel').classList.add('dimmed');
      let t = 200;
      ap(on, vcCard('🎬','MrBeast: $1 vs $1,000,000 Hotel Room','MrBeast · 16 min','badge-playing','Playing now'), t);
      ap(on, chatFab(), t+700);
      ap(on, bub('child', 'Wait, how are they surviving that fall into the pool? That looks insane'), t+1600);
      typ(on, t+2400, 1700);
      ap(on, bub('ai', 'That stunt is carefully planned by professionals. They have stunt coordinators, test the pool depth in advance, and use safety equipment that is not shown on camera. It looks extreme because that is the point, but a lot of work goes into keeping everyone safe.'), t+4200);
      ap(on, bub('child', 'Can I try jumping from high up into a pool like that?'), t+6400);
      typ(on, t+7200, 1700);
      ap(on, bub('ai', 'That is something to avoid at home. What you see in these videos is done by trained professionals with safety measures set up beforehand. Attempting it without that setup is genuinely risky. Enjoy watching it, but leave the stunts to them.'), t+9000);
      ap(on, bub('child', 'Okay fair. Why do they always give so much money away?'), t+11000);
      typ(on, t+11800, 1700);
      ap(on, bub('ai', 'It is basically the whole format. MrBeast puts most of his ad revenue back into bigger videos. The giveaways bring in viewers, which funds the next one. It is an unusual model but it clearly works for him.'), t+13600);
    }
  ]);
}

/* ══════════════════════
   SLIDE 2: REQUEST ACCESS
══════════════════════ */
function buildRequest(card) {
  const { grid, phones } = mk2(card, [
    { cls: 'p-child',  label: 'Child',  who: 'Child',  id: 'rq-child'  },
    { cls: 'p-parent', label: 'Parent', who: 'Parent', id: 'rq-parent' },
  ]);
  const ch = pb(phones[0]), par = pb(phones[1]);

  // shared child side setup used in both Yes and Not Yet phases
  function buildChildSide(b, t) {
    ap(b, vcCard('🏆','Last To Leave Circle Wins $500,000','MrBeast · 22 min','badge-blocked','Restricted'), t);
    ap(b, blkCard('Your parent has restricted this video.'), t+500);
    ap(b, chatFab(), t+1100);
    ap(b, bub('child', 'Can you ask my parent if I can watch this?'), t+2200);
    typ(b, t+3000, 1500);
    ap(b, bub('ai', 'Of course! Tell me why you want to watch it.'), t+4600);
    ap(b, bub('child', 'Its the biggest MrBeast challenge ever and everyone at school already watched it. I am literally the only one who has not seen it.'), t+6400);
    typ(b, t+7300, 1500);
    ap(b, bub('ai', 'That is a solid reason. I will send your parent a message now.'), t+8900);
    ap(b, bub('sys', 'Request sent to parent'), t+10100);
    typ(b, t+10700, 1300);
    ap(b, bub('ai', 'Message sent. I will let you know what they decide.'), t+12100);
  }

  registerPhases([
    /* Phase 0: Child side plays, parent dimmed */
    () => {
      phones[1].closest('.panel').classList.add('dimmed');
      buildChildSide(ch, 300);
    },

    /* Phase 1: Parent approves */
    () => {
      phones[1].closest('.panel').classList.remove('dimmed');
      let t = 300;

      tm(() => {
        const pn = document.createElement('div'); pn.className = 'parent-notif'; pn.id = 'pn-yes';
        pn.innerHTML = `
          <div class="pn-header"><div class="pn-icon">🔔</div><div><div class="pn-title">Access Request</div><div class="pn-app">from AI Mediator</div></div></div>
          <div class="pn-video">Your child wants to watch:<br><strong>Last To Leave Circle Wins $500,000</strong> by MrBeast · 22 min</div>
          <div class="child-reason"><div class="cr-label">In their own words</div><div class="cr-text">"Its the biggest MrBeast challenge ever and everyone at school already watched it. I am literally the only one who has not seen it."</div></div>
          <div class="pn-chips" id="chips-yes">
            <div class="chip chip-info" id="chip-summary-yes">📋 Show video summary</div>
            <div class="chip chip-yes" id="chip-approve">✓ Yes, allow access</div>
            <div class="chip chip-no" id="chip-noyet-placeholder">⏳ Not yet</div>
          </div>`;
        par.appendChild(pn); requestAnimationFrame(() => show(pn)); scr(par);
      }, t);

      tm(() => {
        const vs = document.createElement('div'); vs.className = 'vid-summary';
        vs.innerHTML = `<div class="vs-label">Video Summary</div><div class="vs-text">100 contestants stand in painted circles for as long as possible. High-energy challenge format, no violent or adult content. Suitable for ages 8+.</div>`;
        par.appendChild(vs); requestAnimationFrame(() => show(vs)); scr(par);
        const sc = document.getElementById('chip-summary-yes');
        if (sc) { sc.style.background = 'rgba(91,141,238,0.28)'; sc.style.borderColor = 'rgba(91,141,238,0.8)'; sc.textContent = '📋 Video summary'; }
      }, t+2800);

      tm(() => {
        const ca = document.getElementById('chip-approve');
        const cs = document.getElementById('chip-summary-yes');
        const cn = document.getElementById('chip-noyet-placeholder');
        if (ca) { ca.style.background = 'rgba(52,211,153,0.28)'; ca.style.borderColor = 'rgba(52,211,153,0.9)'; ca.style.fontWeight = '700'; ca.textContent = '✓ Yes, allow access'; }
        if (cs) cs.style.opacity = '0.35';
        if (cn) cn.style.opacity = '0.35';
      }, t+5500);

      tm(() => {
        const b = decBadge('yes','✓ Parent approved');
        par.appendChild(b); requestAnimationFrame(() => show(b)); scr(par);
      }, t+6400);

      ap(ch, bub('ai', 'Your parent approved it! You can watch now 🎉'), t+7800);
      ap(ch, vcCard('🏆','Last To Leave Circle Wins $500,000','MrBeast · 22 min','badge-unlocked','Unlocked ✓'), t+8700);
      ap(ch, bub('child', 'YESSS lets go!!'), t+10000);
    },

    /* Phase 2: Not Yet flow — overlay with full parent + child experience */
    () => {
      const ov = document.createElement('div'); ov.className = 'not-yet-overlay';
      const dim = document.createElement('div'); dim.className = 'nyo-dim'; ov.appendChild(dim);
      const panels = document.createElement('div'); panels.className = 'nyo-panels';

      const pp = document.createElement('div'); pp.className = 'nyo-panel nyo-p';
      pp.innerHTML = `<div class="nyo-label"><div class="label-dot"></div>Parent: Not Yet</div>`;
      const ppf = document.createElement('div'); ppf.className = 'nyo-phone-frame';
      const pph = mkPhone('Parent'); ppf.appendChild(pph); pp.appendChild(ppf); panels.appendChild(pp);

      const cp = document.createElement('div'); cp.className = 'nyo-panel nyo-c';
      cp.innerHTML = `<div class="nyo-label"><div class="label-dot"></div>Child: What they see</div>`;
      const cpf = document.createElement('div'); cpf.className = 'nyo-phone-frame';
      const cph = mkPhone('Child'); cpf.appendChild(cph); cp.appendChild(cpf); panels.appendChild(cp);

      ov.appendChild(panels); grid.appendChild(ov);
      requestAnimationFrame(() => show(ov));

      const ppb = pb(pph), cpb = pb(cph);
      let t = 500;

      // Parent side: notification arrives
      tm(() => {
        const pn = document.createElement('div'); pn.className = 'parent-notif'; pn.id = 'pn-noyet';
        pn.innerHTML = `
          <div class="pn-header"><div class="pn-icon">🔔</div><div><div class="pn-title">Access Request</div><div class="pn-app">from AI Mediator</div></div></div>
          <div class="pn-video">Your child wants to watch:<br><strong>Last To Leave Circle Wins $500,000</strong> by MrBeast · 22 min</div>
          <div class="child-reason"><div class="cr-label">In their own words</div><div class="cr-text">"Its the biggest MrBeast challenge ever and everyone at school already watched it. I am literally the only one who has not seen it."</div></div>
          <div class="pn-chips" id="chips-noyet">
            <div class="chip chip-info" id="ny-chip-summary">📋 Show video summary</div>
            <div class="chip chip-yes" id="ny-chip-approve">✓ Yes, allow access</div>
            <div class="chip chip-no" id="ny-chip-noyet">⏳ Not yet</div>
          </div>`;
        ppb.appendChild(pn); requestAnimationFrame(() => show(pn)); scr(ppb);
      }, t);

      // Parent taps "Not yet" chip
      tm(() => {
        const ca = document.getElementById('ny-chip-approve');
        const cs = document.getElementById('ny-chip-summary');
        const cn = document.getElementById('ny-chip-noyet');
        if (cn) { cn.style.background = 'rgba(45,212,191,0.28)'; cn.style.borderColor = 'rgba(45,212,191,0.9)'; cn.style.fontWeight = '700'; cn.textContent = '⏳ Not yet'; }
        if (ca) ca.style.opacity = '0.35';
        if (cs) cs.style.opacity = '0.35';
      }, t+2800);

      // Parent message input appears
      tm(() => {
        const b = decBadge('no','⏳ Not yet selected');
        ppb.appendChild(b); requestAnimationFrame(() => show(b)); scr(ppb);
      }, t+3600);

      // Parent leaves a message for the child
      tm(() => {
        const msg = document.createElement('div'); msg.className = 'brow parent';
        msg.innerHTML = `<div class="bsender" style="color:var(--teal)">Parent</div><div class="bubble" style="background:#0a1f1e;border:1px solid rgba(45,212,191,0.2);color:var(--text);border-bottom-right-radius:3px;">Not right now. I want to watch the first bit with you so we can decide together. Lets do it tonight after dinner!</div>`;
        ppb.appendChild(msg); requestAnimationFrame(() => show(msg)); scr(ppb);
      }, t+4800);

      tm(() => {
        const b = decBadge('no','Message sent to child');
        ppb.appendChild(b); requestAnimationFrame(() => show(b)); scr(ppb);
      }, t+5800);

      // Child side: sees block, AI relays the decision
      ap(cpb, blkCard('Your parent has restricted this video.'), t+6400);
      typ(cpb, t+7200, 1400);

      tm(() => {
        const row = document.createElement('div'); row.className = 'brow ai show';
        row.innerHTML = `<div class="bsender" style="color:var(--ai-col)">AI Mediator</div><div class="bubble" style="background:#131c32;border:1px solid rgba(96,165,250,0.15);color:var(--text);border-bottom-left-radius:3px;">Your parent said not right now, but left you a message:</div>`;
        cpb.appendChild(row); scr(cpb);
      }, t+8700);

      tm(() => {
        const row = document.createElement('div'); row.className = 'brow ai show';
        row.innerHTML = `<div class="bsender" style="color:var(--ai-col)">AI Mediator</div><div class="bubble" style="background:#131c32;border:1px solid rgba(96,165,250,0.15);color:var(--text);border-bottom-left-radius:3px;font-style:italic;">"Not right now. I want to watch the first bit with you so we can decide together. Lets do it tonight after dinner!"</div>`;
        cpb.appendChild(row); scr(cpb);
      }, t+10000);

      typ(cpb, t+10800, 1400);

      tm(() => {
        const row = document.createElement('div'); row.className = 'brow ai show';
        row.innerHTML = `<div class="bsender" style="color:var(--ai-col)">AI Mediator</div><div class="bubble" style="background:#131c32;border:1px solid rgba(96,165,250,0.15);color:var(--text);border-bottom-left-radius:3px;">Sounds like you two will watch it together tonight.</div>`;
        cpb.appendChild(row); scr(cpb);
      }, t+12300);

      tm(() => {
        const row = document.createElement('div'); row.className = 'brow child show';
        row.innerHTML = `<div class="bsender" style="color:var(--child)">Child</div><div class="bubble" style="background:#1b0e2e;border:1px solid rgba(192,132,252,0.15);color:var(--text);border-bottom-right-radius:3px;">Okay that works.</div>`;
        cpb.appendChild(row); scr(cpb);
      }, t+13800);
    }
  ]);
}

/* ══════════════════════
   SLIDE 3: EXPLAIN RESTRICTION
══════════════════════ */
function buildExplain(card) {
  const { phones } = mk2(card, [
    { cls: 'p-off', label: 'Feature Off', who: 'Child', id: 'ex-off' },
    { cls: 'p-on',  label: 'Feature On',  who: 'Child', id: 'ex-on'  },
  ]);
  const off = pb(phones[0]), on = pb(phones[1]);

  registerPhases([
    () => {
      phones[1].closest('.panel').classList.add('dimmed');
      let t = 300;
      ap(off, blkCard('Your parent has restricted this video.'), t);
      ap(off, bub('child', 'Why is this blocked?'), t+1400);
      ap(off, noticeEl('off','<span>Explain restriction is off.</span> The AI does not respond.'), t+3200);
    },
    () => {
      phones[1].closest('.panel').classList.remove('dimmed');
      phones[0].closest('.panel').classList.add('dimmed');
      let t = 200;
      ap(on, blkCard('Your parent has restricted this video.'), t);
      ap(on, chatFab(), t+700);
      ap(on, bub('child', 'Why is this blocked?'), t+1800);
      typ(on, t+2600, 1700);
      ap(on, bub('ai', 'Your parent blocked it because it has some scenes they wanted to check first before you watch it.'), t+4400);
      ap(on, bub('child', 'But I actually want to watch it though.'), t+6200);
      typ(on, t+7000, 1700);
      ap(on, bub('ai', 'That is totally fair. I can let your parent know you would like to watch it. Want me to send them a message?'), t+8800);
      ap(on, bub('child', 'Yes please.'), t+10700);
      typ(on, t+11500, 1600);
      ap(on, bub('ai', 'Sent. They will take a look and get back to you. It is worth having that conversation with them too.'), t+13200);
      ap(on, toastEl('Your child would like to watch a restricted video. They have asked AI Mediator to let you know.'), t+14700);
    }
  ]);
}

window.addEventListener('load', () => { setTimeout(() => { buildSkeleton(); renderSlide(0); }, 300); });
</script>
