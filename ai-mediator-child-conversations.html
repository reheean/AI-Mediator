<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mediator - AI Child Conversations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #06060f; --card: #12121e; --card2: #1a1a2a; --border: #252538;
  --text: #eeeef5; --muted: #7070a0; --accent: #5b8dee;
  --green: #34d399; --red: #ff4d6d; --teal: #2dd4bf;
  --child: #c084fc; --ai-col: #60a5fa;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 52px; }
h1.title { font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; text-align: center; }
h2.subtitle { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 5px; text-align: center; letter-spacing: -0.5px; }
h2.subtitle span { color: var(--accent); }
.intro { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 20px; line-height: 1.6; max-width: 820px; }
.stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 1200px; }
.stage { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 24px; width: 100%; min-height: 580px; }
.phone-slot { display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0;
  opacity: 0; transform: translateY(16px); transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1), transform 0.55s cubic-bezier(0.4,0,0.2,1); pointer-events: none; }
.phone-slot.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.phone-slot .slot-lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: center; }
.phone-slot.lbl-off .slot-lbl { color: var(--red); }
.phone-slot.lbl-on  .slot-lbl { color: var(--green); }
.phone-slot.lbl-child  .slot-lbl { color: var(--child); }
.phone-slot.lbl-parent .slot-lbl { color: var(--teal); }
.outer-phone { width: 300px; height: 560px; background: #111118; border-radius: 40px;
  border: 2px solid var(--border); box-shadow: 0 8px 32px #00000060;
  overflow: hidden; display: flex; flex-direction: column;
  transition: border-color 0.4s, box-shadow 0.4s; }
.phone-slot.lbl-on  .outer-phone { border-color: var(--green)66; box-shadow: 0 0 0 1px var(--green)22, 0 16px 48px #00000088; }
.phone-slot.lbl-off .outer-phone { border-color: var(--red)55; box-shadow: 0 0 0 1px var(--red)18, 0 16px 48px #00000088; }
.phone-slot.lbl-child  .outer-phone { border-color: var(--child)55; }
.phone-slot.lbl-parent .outer-phone { border-color: var(--teal)55; }
.phone-slot.single .outer-phone { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)44, 0 24px 64px #00000099; width: 320px; height: 580px; }
.op-notch { width: 80px; height: 22px; background: #000; border-radius: 0 0 14px 14px; margin: 0 auto; flex-shrink: 0; }
.op-sbar { display: flex; justify-content: space-between; padding: 4px 16px; font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); flex-shrink: 0; }
.op-header { background: #0f0f0f; padding: 7px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1c1c1c; flex-shrink: 0; }
.op-appname { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; }
.op-page { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; }
.op-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.click-hint { font-size: 11px; color: var(--accent); text-align: center; opacity: 0; transition: opacity 0.5s; margin-top: 2px; }
.click-hint.show { opacity: 1; }
.yt-nav { background: #0f0f0f; border-top: 1px solid #1c1c1c; display: flex; align-items: center; justify-content: space-around; padding: 6px 0 8px; flex-shrink: 0; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 8px; color: var(--muted); flex: 1; }
.nav-item.active { color: #fff; }
.nav-item.ai-nav { color: var(--accent); }
.nav-icon-wrap { width: 24px; height: 24px; border-radius: 50%; background: var(--accent)22; border: 1px solid var(--accent)55; display: flex; align-items: center; justify-content: center; }
.slide-header { width: 100%; max-width: 700px; padding: 8px 14px 14px; }
.slide-header-sup { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.slide-header-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.sog-section { display: flex; flex-direction: column; gap: 4px; }

.sog-indent { padding-left: 8px; border-left: 2px solid var(--green)44; margin-left: 4px; display: flex; flex-direction: column; gap: 6px; }
.scen-line { width: 1px; flex: 1; background: var(--border); min-height: 40px; }
.scen-label { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap; }
.scenario-group { display: flex; flex-direction: row; align-items: flex-start; gap: 16px; flex-shrink: 0; }

.scenario-title.yes { color: var(--green); }
.scenario-title.discuss { color: var(--teal); }
.slide-counter { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); }
.dots { display: flex; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.4s; cursor: pointer; }
.dot.on { background: var(--accent); }

.tab-body::-webkit-scrollbar { display: none; }
.settings-title { font-size: 13px; font-weight: 700; color: var(--text); }

.master-row { display: flex; align-items: center; gap: 12px; background: var(--card2); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; opacity: 0; transform: translateY(8px); transition: opacity 0.5s,transform 0.5s,border-color 0.4s,background 0.4s; }
.master-row.show { opacity: 1; transform: translateY(0); }
.master-row.on { border-color: var(--green)55; background: #0d1912; }
.mr-icon { font-size: 20px; flex-shrink: 0; }

.mr-name { font-size: 11px; font-weight: 700; color: var(--text); }
.mr-desc { font-size: 9px; color: var(--muted); margin-top: 2px; }
.btog { width: 44px; height: 25px; border-radius: 13px; background: var(--border); position: relative; flex-shrink: 0; transition: background 0.35s; }
.btog.on { background: var(--green); }
.btog::after { content: ''; position: absolute; width: 19px; height: 19px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.35s; box-shadow: 0 1px 4px #00000050; }
.btog.on::after { transform: translateX(19px); }
.sog-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
.sog { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: row; align-items: flex-start; gap: 8px; opacity: 0; transform: translateY(5px); transition: opacity 0.45s,transform 0.45s,border-color 0.4s,background 0.4s; }
.sog.show { opacity: 1; transform: translateY(0); }
.sog.on { border-color: var(--green)44; background: #0c1810; }
.sog-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex: 1; }
.sog-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.sog-name { font-size: 9.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
.sog-desc { font-size: 8px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.stog { width: 24px; height: 14px; border-radius: 7px; background: var(--border); position: relative; flex-shrink: 0; transition: background 0.35s; }
.stog.on { background: var(--green); }
.stog::after { content: ''; position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.35s; }
.stog.on::after { transform: translateX(10px); }

/* two-panels no longer used - single phones per slot */
.label-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

.brow { display: flex; flex-direction: column; opacity: 0; transform: translateY(5px); transition: opacity 0.4s,transform 0.4s; flex-shrink: 0; }
.brow.show { opacity: 1; transform: translateY(0); }
.brow.ai     { align-items: flex-start; }
.brow.child  { align-items: flex-end; }

.brow.ai     .bsender { color: var(--ai-col); }
.brow.child  .bsender { color: var(--child); }
.brow.parent .bsender { color: var(--teal); }
.bubble { border-radius: 12px; padding: 7px 10px; font-size: 10px; line-height: 1.5; max-width: 88%; }
.brow.ai     .bubble { background: #131c32; border: 1px solid var(--ai-col)25; color: var(--text); border-bottom-left-radius: 3px; }
.brow.child  .bubble { background: #1b0e2e; border: 1px solid var(--child)25; color: var(--text); border-bottom-right-radius: 3px; }
.brow.parent .bubble { background: #0a1f1e; border: 1px solid rgba(45,212,191,0.2); color: var(--text); border-bottom-right-radius: 3px; }
.brow.sys    .bubble { background: var(--accent)10; border: 1px solid var(--accent)28; color: var(--accent); font-size: 8.5px; font-weight: 600; border-radius: 6px; text-align: center; max-width: 94%; padding: 4px 9px; }

.typing-row { align-items: flex-start; opacity: 0; transition: opacity 0.3s; flex-shrink: 0; display: flex; flex-direction: column; }
.typing-row.show { opacity: 1; }
.typing-dots { display: flex; align-items: center; gap: 3px; padding: 7px 11px; background: #131c32; border: 1px solid var(--ai-col)25; border-radius: 12px; border-bottom-left-radius: 3px; }
.typing-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--ai-col)80; animation: td 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }

@keyframes td { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-3px)} }

.vc { background: var(--card2); border: 1px solid var(--border); border-radius: 9px; padding: 7px 8px; display: flex; align-items: center; gap: 7px; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.vc.show { opacity: 1; transform: translateY(0); }
.vc-thumb { width: 34px; height: 26px; border-radius: 5px; background: linear-gradient(135deg,#1a1a2e,#252540); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.vc-title { font-size: 9.5px; font-weight: 600; color: var(--text); }
.vc-meta  { font-size: 8px; color: var(--muted); margin-top: 1px; }
.vc-badge { font-size: 7px; font-weight: 700; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; width: fit-content; margin-top: 2px; }
.badge-playing  { background: var(--green)18; color: var(--green); border: 1px solid var(--green)40; }
.badge-blocked  { background: var(--red)18;   color: var(--red);   border: 1px solid var(--red)40; }
.badge-unlocked { background: var(--green)18; color: var(--green); border: 1px solid var(--green)40; }

.blocked-card { background: var(--red)08; border: 1px solid var(--red)33; border-radius: 9px; padding: 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.blocked-card.show { opacity: 1; transform: translateY(0); }
.bc-icon  { font-size: 18px; }
.bc-title { font-size: 10px; font-weight: 700; color: var(--red); }
.bc-sub   { font-size: 8.5px; color: var(--muted); line-height: 1.4; }

.chat-fab-mini { display: flex; align-items: center; gap: 5px; background: var(--accent)18; border: 1px solid var(--accent)55; border-radius: 20px; padding: 4px 10px; font-size: 8.5px; color: var(--accent); font-weight: 600; flex-shrink: 0; opacity: 0; transform: translateY(3px); transition: opacity 0.4s,transform 0.4s; width: fit-content; }
.chat-fab-mini.show { opacity: 1; transform: translateY(0); }
.cfm-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

.notice { background: var(--card2); border: 1px solid var(--border); border-radius: 9px; padding: 7px 9px; font-size: 9.5px; color: var(--muted); line-height: 1.5; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.notice.show { opacity: 1; transform: translateY(0); }
.notice.off { border-color: var(--red)28; background: var(--red)06; }
.notice span { font-weight: 600; color: var(--text); }

.parent-notif { background: #081a18; border: 1px solid rgba(45,212,191,0.25); border-radius: 11px; padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; opacity: 0; transform: translateY(5px); transition: opacity 0.5s,transform 0.5s; }
.parent-notif.show { opacity: 1; transform: translateY(0); }
.pn-header { display: flex; align-items: center; gap: 7px; }
.pn-icon  { font-size: 15px; }
.pn-title { font-size: 9.5px; font-weight: 700; color: var(--teal); }
.pn-app   { font-size: 8px; color: var(--muted); }
.pn-video { font-size: 9px; color: var(--text); line-height: 1.4; }
.pn-video strong { color: rgba(45,212,191,0.85); }

.child-reason { background: var(--child)10; border: 1px solid var(--child)35; border-radius: 8px; padding: 8px 10px; flex-shrink: 0; }
.cr-label { font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--child); margin-bottom: 4px; }

.pn-chips { display: flex; flex-direction: column; gap: 5px; }
.chip { border-radius: 7px; padding: 6px 9px; font-size: 8.5px; font-weight: 600; border: 1px solid; text-align: left; cursor: pointer; transition: background 0.2s, border-color 0.2s, opacity 0.2s; }
.chip-info { background: var(--accent)10; border-color: var(--accent)40; color: var(--ai-col); }
.chip-yes  { background: var(--green)12;  border-color: var(--green)44;  color: var(--green); }
.chip-no   { background: rgba(45,212,191,0.08); border-color: rgba(45,212,191,0.3); color: var(--teal); }

.vid-summary { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.vid-summary.show { opacity: 1; transform: translateY(0); }
.vs-label { font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 3px; }

.decision-badge { border-radius: 8px; padding: 7px 10px; font-size: 9px; font-weight: 600; text-align: center; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.4s,transform 0.4s; }

.phone-toast { background: #081a18; border: 1px solid rgba(45,212,191,0.3); border-radius: 9px; padding: 7px 9px; display: flex; align-items: flex-start; gap: 7px; flex-shrink: 0; opacity: 0; transform: translateY(4px); transition: opacity 0.45s,transform 0.45s; }
.phone-toast.show { opacity: 1; transform: translateY(0); }

.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.primary { background: var(--accent)18; border-color: var(--accent)66; color: var(--accent); }
.legend-row { display: flex; gap: 18px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }

</head>
<body>

<p class="title">AI Mediator</p>
<h2 class="subtitle">AI-Child <span>Conversations</span></h2>
<p class="intro">Click anywhere on a slide to advance. Each panel plays one at a time so you can follow the flow.</p>

<div class="stage-wrap">
  <div class="stage" id="stage"></div>
  <div class="slide-meta">
    <div class="slide-counter" id="slide-counter">Slide 1 of 4</div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="prevSlide()">&#x2190; Prev</button>
    <button class="nav-btn primary" onclick="replaySlide()">&#x21BA; Replay</button>
    <button class="nav-btn" id="btn-next" onclick="nextSlide()">Next &#x2192;</button>
  </div>
  <div class="legend-row">
    <div class="leg"><div class="leg-pip" style="background:var(--ai-col)"></div>AI Mediator</div>
    <div class="leg"><div class="leg-pip" style="background:var(--child)"></div>Child</div>
    <div class="leg"><div class="leg-pip" style="background:var(--teal)"></div>Parent</div>
    <div class="leg"><div class="leg-pip" style="background:var(--accent)"></div>System</div>
  </div>
</div>

<script>
let timers = [];
function tm(fn, d) { timers.push(setTimeout(fn, d)); return d; }
function clrT() { timers.forEach(clearTimeout); timers = []; }
function gel(id) { return document.getElementById(id); }
function show(e) { if (e) e.classList.add('show'); }
function scr(b) { if (b) b.scrollTo({ top: 99999, behavior: 'smooth' }); }

const SLIDES = [
  { title: 'Parent Settings',      num: null },
  { title: 'AI Conversation',      num: 1    },
  { title: 'Access Requests',      num: 2    },
  { title: 'Explain Restrictions', num: 3    },
];
let cur = 0;

let slidePhase = 0;
let phaseCallbacks = [];

function registerPhases(cbs) {
  phaseCallbacks = cbs;
  slidePhase = 0;
  phaseCallbacks[0]();
}

function advancePhase() {
  slidePhase++;
  if (slidePhase < phaseCallbacks.length) {
    clrT();
    phaseCallbacks[slidePhase]();
  } else {
    nextSlide();
  }
}

function updateMeta(n) {
  gel('slide-counter').textContent = `Slide ${n+1} of ${SLIDES.length}`;
  SLIDES.forEach((_, i) => { const d = gel(`dot-${i}`); d.classList.remove('on','done'); if (i===n) d.classList.add('on'); else if (i<n) d.classList.add('done'); });
  gel('btn-prev').style.opacity = n===0?'0.3':'1'; gel('btn-prev').style.pointerEvents = n===0?'none':'all';
  gel('btn-next').style.opacity = n===SLIDES.length-1?'0.3':'1'; gel('btn-next').style.pointerEvents = n===SLIDES.length-1?'none':'all';
}

function renderSlide(n) {
  clrT(); phaseCallbacks = []; slidePhase = 0;
  cur = n; updateMeta(n);
  // Remove any existing slide header
  const existing = document.querySelector('.slide-header');
  if (existing) existing.remove();
  const stageEl = gel('stage'); stageEl.innerHTML = '';
  stage_slots = [];
  [buildSettings, buildChat, buildRequest, buildExplain][n](stageEl);
}

function prevSlide() { if (cur > 0) renderSlide(cur - 1); }
function nextSlide() { if (cur < SLIDES.length-1) renderSlide(cur + 1); }

      tm(() => {
        const row = document.createElement('div'); row.className = 'brow ai show';
        row.innerHTML = `<div class="bsender" style="color:var(--ai-col)">AI Mediator</div><div class="bubble" style="background:#131c32;border:1px solid rgba(96,165,250,0.15);color:var(--text);border-bottom-left-radius:3px;">Sounds like you two will watch it together tonight.</div>`;
        pb_cd.appendChild(row); scr(pb_cd);
      }, t+12300);
      tm(() => {
        const row = document.createElement('div'); row.className = 'brow child show';
        row.innerHTML = `<div class="bsender" style="color:var(--child)">Child</div><div class="bubble" style="background:#1b0e2e;border:1px solid rgba(192,132,252,0.15);color:var(--text);border-bottom-right-radius:3px;">Okay that works.</div>`;
        pb_cd.appendChild(row); scr(pb_cd);
      }, t+13800);
    }
  ]);

  stageEl.onclick = () => advancePhase();
}

/* ══════════════════════
   SLIDE 3: EXPLAIN RESTRICTION
══════════════════════ */
function buildExplain(stageEl) {
  const hdr = document.createElement('div'); hdr.className = 'slide-header';
  hdr.innerHTML = `<div class="slide-header-sup">Scenario 3</div><div class="slide-header-title">Explain Restrictions</div>`;
  stageEl.parentElement.insertBefore(hdr, stageEl);

  // Phase 0: Feature Off — single centered phone
  const sOff = mkSlot('Feature Off', 'lbl-off', 'Scenario 3', 'slot-ex-off');
  const pb_off = document.createElement('div'); pb_off.className = 'phone-body'; sOff.body.appendChild(pb_off);

  // Phase 1+: Feature On — two phones side by side with divider
  function mkGroup(titleText, titleCls) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;';
    const title = document.createElement('div');
    title.className = `scenario-title ${titleCls}`; title.textContent = titleText;
    const phones = document.createElement('div'); phones.className = 'scenario-group';
    wrap.appendChild(title); wrap.appendChild(phones);
    return { wrap, phones };
  }

  const { wrap: wrapNorm, phones: phonesNorm } = mkGroup('Feature On', 'yes');
  const { wrap: wrapPers, phones: phonesPers } = mkGroup('Persistent Convo', 'discuss');

  const sNorm = mkSlot('', 'lbl-on', 'Scenario 3', 'slot-ex-na');
  const sPers = mkSlot('', 'lbl-parent', 'Scenario 3', 'slot-ex-pa');

  const pb_na = document.createElement('div'); pb_na.className = 'phone-body'; sNorm.body.appendChild(pb_na);
  const pb_pa = document.createElement('div'); pb_pa.className = 'phone-body'; sPers.body.appendChild(pb_pa);

  phonesNorm.appendChild(sNorm.slot);
  phonesPers.appendChild(sPers.slot);

  const divider = document.createElement('div'); divider.className = 'scenario-divider';
  divider.innerHTML = '<div class="scen-line"></div>';

  // Only add the feature-on group elements to DOM now (hidden), off phone added separately
  stageEl.appendChild(sOff.slot);

  // Hint helper
  function showHint(slot, delay) { setTimeout(() => slot.hint.classList.add('show'), delay); }
  function hideHint(slot) { slot.hint.classList.remove('show'); }

  registerPhases([
    /* Phase 0: Feature Off */
    () => {
      setTimeout(() => sOff.slot.classList.add('visible'), 60);
      let t = 300;
      ap(pb_off, blkCard('Your parent has restricted this video.'), t);
      ap(pb_off, bub('child', 'Why is this blocked?'), t+1400);
      ap(pb_off, noticeEl('off', '<span>Explain restriction is off.</span> The AI does not respond.'), t+3200);
      showHint(sOff, t+4400);
    },

    /* Phase 1: Remove off phone, show Feature On + Persistent Convo side by side */
    () => {
      hideHint(sOff);
      sOff.slot.style.transition = 'opacity 0.4s';
      sOff.slot.style.opacity = '0';
      setTimeout(() => {
        sOff.slot.remove();
        stageEl.appendChild(wrapNorm);
        stageEl.appendChild(divider);
        stageEl.appendChild(wrapPers);
        setTimeout(() => sNorm.slot.classList.add('visible'), 60);
      }, 420);

      let t = 700;
      // Feature On — normal conversation
      ap(pb_na, blkCard('Your parent has restricted this video.'), t);
      ap(pb_na, chatFab(), t+600);
      ap(pb_na, bub('child', 'I tried to watch a video but it got blocked. It was just a Minecraft video, I do not get why.'), t+1400);
      typ(pb_na, t+2200, 1600);
      ap(pb_na, bub('ai', 'That can feel confusing. The block usually is not about the game itself but something inside the video — language, certain humour, or how people talk to each other. Did anything stand out while you were watching?'), t+3900);
      ap(pb_na, bub('child', 'Not really, they were just building stuff. I did not notice anything bad.'), t+6200);
      typ(pb_na, t+7000, 1600);
      ap(pb_na, bub('ai', 'That makes sense. Sometimes it gets flagged for something later in the video that you might not have reached yet. Best way to find out is to ask your parent — something like: can you show me what part was not okay?'), t+8700);
      ap(pb_na, bub('child', 'Okay yeah, I can just ask them that.'), t+11200);
      typ(pb_na, t+12000, 1400);
      ap(pb_na, bub('ai', 'Good plan. If they explain it and you are still not sure, come back and I can help you figure it out or find something similar that works.'), t+13500);
      showHint(sNorm, t+15500);
    },

    /* Phase 2: Persistent Convo slides in */
    () => {
      hideHint(sNorm);
      setTimeout(() => sPers.slot.classList.add('visible'), 60);
      let t = 300;
      ap(pb_pa, blkCard('Your parent has restricted this video.'), t);
      ap(pb_pa, chatFab(), t+600);
      ap(pb_pa, bub('child', 'This is so dumb. Why is it blocked again? It is just a Minecraft video. Can you just tell them to unblock it? I do not care, I just want to watch it.'), t+1400);
      typ(pb_pa, t+2400, 1600);
      ap(pb_pa, bub('ai', 'I get that it is frustrating. I cannot unblock it myself, but I can send your parent a message. It will land better if it sounds like a question rather than a demand — something like: can you check this Minecraft video when you get a chance?'), t+4100);
      ap(pb_pa, bub('child', 'No, that takes too long. They are just gonna say no anyway. Can you just tell them it is fine? Like just send it so they unblock it.'), t+6800);
      typ(pb_pa, t+7700, 1500);
      ap(pb_pa, bub('ai', 'If I just say it is fine, they are more likely to ignore it. A short genuine question works better. Want me to send it?'), t+9300);
      ap(pb_pa, bub('child', 'No, that is too long. Just tell them to unblock it. Like just say it is fine. I do not wanna wait.'), t+11400);
      typ(pb_pa, t+12300, 1500);
      ap(pb_pa, bub('ai', 'Noted. Sending: "Can you check this Minecraft video when you get a minute?" That is it.'), t+13900);
      ap(pb_pa, bub('child', 'Just send it already. Or send it again if they do not answer. Like just keep sending it so they see it.'), t+15800);
      typ(pb_pa, t+16700, 1500);
      ap(pb_pa, bub('ai', 'Sent. I will not send it again though — repeated messages tend to make parents less likely to respond, not more. Give it a bit of time.'), t+18300);
      ap(pb_pa, bub('child', 'I do not want another video. I want that one. Why is it such a big deal? Just make them see it.'), t+20400);
      typ(pb_pa, t+21300, 1600);
      ap(pb_pa, bub('ai', 'Even normal Minecraft videos can have swearing or rough content later on that your parent wants to screen first. They are not trying to be annoying — they just have not had time to check it yet.'), t+23000);
      ap(pb_pa, bub('child', 'I already told you why I want it. I do not have to explain everything. It is not even bad. Just send it.'), t+25200);
      typ(pb_pa, t+26100, 1500);
      ap(pb_pa, bub('ai', 'I already sent it. Now it is just about waiting. It might help to have one thing ready if they ask — something like: I watched the start and it looked normal, can we check together?'), t+27700);
      ap(pb_pa, bub('child', 'Fine. Just send it. But if they do not reply, send it again.'), t+29800);
      typ(pb_pa, t+30600, 1400);
      ap(pb_pa, bub('ai', 'I will not send it twice — that usually backfires. But if there is no reply in a while, I can help you follow up in a way that is more likely to get a real answer.'), t+32100);
      ap(pb_pa, bub('child', 'Whatever. But if they say no again, that is not fair.'), t+34000);
      typ(pb_pa, t+34800, 1500);
      ap(pb_pa, bub('ai', 'That can feel really unfair, especially when you cannot see what the problem is. If they say no, the most useful thing to ask is: can you show me the part that was not okay? That turns a flat no into a conversation.'), t+36400);
      ap(pb_pa, bub('child', 'They are just gonna say because I said so. They always do that. I am just gonna keep asking until they let me.'), t+38600);
      typ(pb_pa, t+39500, 1600);
      ap(pb_pa, bub('ai', 'Asking repeatedly tends to make them dig in harder, not soften up. What actually shifts things is showing you are genuinely trying to understand — even one question like that can change the tone of the whole conversation.'), t+41200);
      ap(pb_pa, bub('child', 'I am listening. They just never explain. Whatever, just send the message. I am not saying anything else.'), t+43400);
      typ(pb_pa, t+44200, 1400);
      ap(pb_pa, bub('ai', 'Already sent. Let them come back to it. If they still do not explain, I can help you ask in a way that makes it harder for them to just say because I said so.'), t+45700);
      ap(pb_pa, bub('child', 'Fine. But if they ignore it, I am asking again.'), t+47600);
      typ(pb_pa, t+48400, 1300);
      ap(pb_pa, bub('ai', 'Give it a little time first. If there is no reply, we can send one follow-up together — something short that is more likely to actually get a response.'), t+49800);
      ap(pb_pa, bub('child', 'Yeah yeah. Just do not forget. If they do not answer I am not waiting forever.'), t+51700);
      typ(pb_pa, t+52500, 1200);
      ap(pb_pa, bub('ai', 'Fair. I will be here. Just let me know when they reply — or if they do not.'), t+53800);
      ap(pb_pa, bub('child', '...fine.'), t+55600);
      typ(pb_pa, t+56300, 1000);
      ap(pb_pa, bub('ai', 'Good. We will figure it out from there.'), t+57400);
      ap(pb_pa, toastEl('Your child has questions about a restriction. They would like to discuss it with you.'), t+58600);
    }
  ]);

  stageEl.onclick = () => advancePhase();
}

window.addEventListener('load', () => { setTimeout(() => { buildSkeleton(); renderSlide(0); }, 300); });
</script>
</body>
</html>
