<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Concepts</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0a12;
    color: #f0f0f5;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
  }
  .grid4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(240px, 1fr));
    gap: 20px;
    width: min(1280px, calc(100vw - 48px));
    max-width: 1280px;
    margin: 0 auto;
  }
  .card {
    background: #12121e; border: 1px solid #262640; border-radius: 22px;
    padding: 36px 24px 28px; display: flex; flex-direction: column; align-items: center;
    gap: 16px; position: relative;
    min-width: 0;
  }
  .card-tag {
    position: absolute; top: 16px; left: 18px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: #6a6a90;
  }
  .icon-wrap { width: 150px; height: 150px; }
  .icon-wrap svg { width: 100%; height: 100%; }
  .ai-name { font-size: 22px; font-weight: 800; letter-spacing: -0.2px; }
  .toggle-btn {
    background: #6d8bff18; border: 1px solid #6d8bff55; color: #6d8bff;
    border-radius: 20px; padding: 8px 16px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .toggle-btn:hover { background: #6d8bff28; }
  .toggle-btn.working { background: #34d39918; border-color: #34d39955; color: #34d399; }
  .status-txt { font-size: 11px; color: #6a6a90; min-height: 14px; }

  .rot { animation: hueshift 2.2s linear infinite; animation-play-state: paused; }
  .rot.spin { animation-play-state: running; }
  @keyframes hueshift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

  @media (max-width: 1080px) {
    body { justify-content: flex-start; overflow-x: auto; }
    .grid4 {
      width: max-content;
      min-width: 1040px;
      grid-template-columns: repeat(4, 240px);
      padding-right: 24px;
    }
  }
</style>
</head>
